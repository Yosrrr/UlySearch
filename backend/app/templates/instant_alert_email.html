<html>
<body style="font-family: Arial, sans-serif;">
  <h2 style="color:#c0392b;">🔴 Offre très pertinente détectée</h2>
  {% if tender.acheteur_connu == "Oui" %}
  <p style="background:#FFD700; color:#1F3864; padding:6px 12px; display:inline-block; border-radius:4px; font-weight:bold;">
    ⭐ CLIENT CONNU
  </p>
  {% endif %}
  <table style="border-collapse: collapse; width:100%; margin-top:10px;">
    <tr><td><b>Objet</b></td><td>{{ tender.objet }}</td></tr>
    <tr><td><b>Acheteur</b></td><td>{{ tender.acheteur }}</td></tr>
    <tr><td><b>Score</b></td><td>{{ score }}%</td></tr>
    <tr><td><b>Date limite</b></td><td>{{ tender.date_limite or "Non communiquée" }}</td></tr>
    <tr><td><b>Lien</b></td><td><a href="{{ tender.lien }}">{{ tender.lien }}</a></td></tr>
  </table>
</body>
</html>
