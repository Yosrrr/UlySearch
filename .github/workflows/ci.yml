name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      # F-001 : l'application doit démarrer depuis les dépendances déclarées
      - name: Import check
        run: python -c "import app.main; print('Import OK')"
        env:
          ENV: development

      # F-002 : alembic doit trouver sa configuration
      - name: Alembic config check
        run: alembic heads

      # Tests unitaires (sans base de données ni Redis)
      - name: Unit tests
        run: >
          python -m pytest
          scripts/test_universal_contract.py
          scripts/test_keyword_scorer.py
          scripts/test_pipeline_helpers.py
          scripts/test_pipeline_logger.py
          scripts/test_export_security.py
          scripts/test_config_guards.py
          scripts/test_auth_deps.py
          scripts/test_dedup_feedback.py
          scripts/test_scoring_guards.py
          scripts/test_undp_dates.py
          -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx eslint src

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}