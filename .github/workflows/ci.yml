name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Import check
        run: python -c "import app.main; print('Import OK')"
        env:
          ENV: development

      # F-002 : alembic doit trouver sa configuration
      - name: Alembic config check
        run: alembic heads

      # Tests unitaires (sans base de données ni Redis)
      - name: Static check (noms indefinis, imports morts)
        run: python -m pyflakes app scripts

      - name: Unit tests
        run: python -m pytest scripts/ -q
        env:
          ENV: development

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx eslint src
      - run: npm audit --omit=dev --audit-level=high

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ulysearch
          POSTGRES_PASSWORD: ulysearch
          POSTGRES_DB: ulysearch_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ulysearch"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        working-directory: backend
        run: pip install -r requirements-dev.txt
      - name: Migration up/down/up roundtrip (OPS-001)
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://ulysearch:ulysearch@localhost:5432/ulysearch_ci
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
