databases:
  - name: UlySearch-db
    plan: basic-256mb
    region: frankfurt
    databaseName: UlySearch
    user: UlySearch

services:
  - type: keyvalue
    name: UlySearch-redis
    plan: starter
    region: frankfurt
    ipAllowList: []
    maxmemoryPolicy: noeviction

  # ─── Service web (API + frontend) ────────────────────────────────
  - type: web
    name: UlySearch
    runtime: docker
    plan: starter
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    
    preDeployCommand: cd backend && alembic upgrade head && python -m scripts.bootstrap
    envVars:
      - key: ENV
        value: production

      # Base de données
      - key: DATABASE_URL
        fromDatabase:
          name: UlySearch-db
          property: connectionString

      # Redis (broker + cache partagés)
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: UlySearch-redis
          property: connectionString
      - key: CACHE_REDIS_URL
        fromService:
          type: keyvalue
          name: UlySearch-redis
          property: connectionString

      # Sécurité
      - key: JWT_SECRET_KEY
        generateValue: true
      
      - key: SOURCE_CREDENTIALS_KEY
        generateValue: true

      
      - key: CORS_ORIGINS
        value: https://ulysearch.onrender.com

      # Admin initial
      - key: INITIAL_ADMIN_EMAIL
        sync: false
      - key: INITIAL_ADMIN_PASSWORD
        sync: false
      - key: INITIAL_ADMIN_NAME
        value: Administrateur UlySearch

      # Alertes
      - key: ADMIN_ALERT_EMAIL
        sync: false

      
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SENDER_EMAIL
        sync: false

      # Divers
      - key: COMMERCIALS_SEED
        sync: false

      # Ollama (F-009 : déclarez l'endpoint si vous en avez un)
      # - key: OLLAMA_HOST
      #   value: https://votre-endpoint-ollama.example.com
      # - key: OLLAMA_MODEL
      #   value: qwen2.5:3b-instruct

  # ─── Worker Celery ────────────────────────────────────────────────
  - type: worker
    name: UlySearch-worker
    runtime: docker
    plan: starter
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: celery -A app.core.celery_app worker --loglevel=INFO --concurrency=2
    envVars:
      - key: ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: UlySearch-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: UlySearch-redis
          property: connectionString
      - key: CACHE_REDIS_URL
        fromService:
          type: keyvalue
          name: UlySearch-redis
          property: connectionString
      
      - key: SOURCE_CREDENTIALS_KEY
        fromService:
          type: web
          name: UlySearch
          envVarKey: SOURCE_CREDENTIALS_KEY
      - key: JWT_SECRET_KEY
        fromService:
          type: web
          name: UlySearch
          envVarKey: JWT_SECRET_KEY
      - key: SMTP_HOST
        fromService:
          type: web
          name: UlySearch
          envVarKey: SMTP_HOST
      - key: SMTP_PORT
        fromService:
          type: web
          name: UlySearch
          envVarKey: SMTP_PORT
      - key: SMTP_USER
        fromService:
          type: web
          name: UlySearch
          envVarKey: SMTP_USER
      - key: SMTP_PASSWORD
        fromService:
          type: web
          name: UlySearch
          envVarKey: SMTP_PASSWORD
      - key: SENDER_EMAIL
        fromService:
          type: web
          name: UlySearch
          envVarKey: SENDER_EMAIL
      - key: ADMIN_ALERT_EMAIL
        fromService:
          type: web
          name: UlySearch
          envVarKey: ADMIN_ALERT_EMAIL
      - key: CORS_ORIGINS
        fromService:
          type: web
          name: UlySearch
          envVarKey: CORS_ORIGINS

  # ─── Scheduler Celery Beat ────────────────────────────────────────
  - type: worker
    name: UlySearch-scheduler
    runtime: docker
    plan: starter
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: celery -A app.core.celery_app beat --loglevel=INFO --schedule=/tmp/celerybeat-schedule
    envVars:
      - key: ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: UlySearch-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: UlySearch-redis
          property: connectionString
      - key: CACHE_REDIS_URL
        fromService:
          type: keyvalue
          name: UlySearch-redis
          property: connectionString
      - key: SOURCE_CREDENTIALS_KEY
        fromService:
          type: web
          name: UlySearch
          envVarKey: SOURCE_CREDENTIALS_KEY
      - key: JWT_SECRET_KEY
        fromService:
          type: web
          name: UlySearch
          envVarKey: JWT_SECRET_KEY
      - key: ADMIN_ALERT_EMAIL
        fromService:
          type: web
          name: UlySearch
          envVarKey: ADMIN_ALERT_EMAIL