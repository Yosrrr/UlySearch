databases:
  - name: UlySearch-db
    plan: basic-256mb
    region: frankfurt
    databaseName: UlySearch
    user: UlySearch

services:
  # ─── Redis broker Celery (pas d'éviction) ────────────────────────
  - type: keyvalue
    name: UlySearch-redis
    plan: starter
    region: frankfurt
    ipAllowList: []
    maxmemoryPolicy: noeviction

  # ─── Redis cache applicatif (F-031 : éviction autorisée) ─────────
  - type: keyvalue
    name: UlySearch-cache
    plan: starter
    region: frankfurt
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru

  # ─── Service web (API + frontend) ────────────────────────────────
  - type: web
    name: UlySearch
    runtime: docker
    plan: starter
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    preDeployCommand: cd backend && alembic upgrade head && python -m scripts.bootstrap
    envVars:
      - key: ENV
        value: production
      - key: UNIVERSAL_ENRICH_DETAIL
        value: "false"

      # Base de données
      - key: DATABASE_URL
        fromDatabase:
          name: UlySearch-db
          property: connectionString

      # Redis : broker Celery
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: UlySearch-redis
          property: connectionString

      # Redis : cache applicatif (F-031)
      - key: CACHE_REDIS_URL
        fromService:
          type: keyvalue
          name: UlySearch-cache
          property: connectionString

      # Sécurité
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: SOURCE_CREDENTIALS_KEY
        generateValue: true

      - key: CORS_ORIGINS
        value: https://ulysearch.onrender.com

      # IA désactivée en cloud (F-009)
      - key: LLM_ENABLED
        value: "false"

      # Pas de scan immédiat à l'inscription (F-012)
      - key: RUN_PIPELINE_ON_REGISTER
        value: "false"

      # TUNEPS : pas de vérification TLS côté cloud, aucun identifiant envoyé (F-021)
      - key: TUNEPS_SSL_VERIFY
        value: "false"

      # Admin initial
      - key: INITIAL_ADMIN_EMAIL
        sync: false
      - key: INITIAL_ADMIN_PASSWORD
        sync: false
      - key: INITIAL_ADMIN_NAME
        value: Administrateur UlySearch

      # Alertes
      - key: ADMIN_ALERT_EMAIL
        sync: false
      - key: DIRECTION_EMAIL
        sync: false

      # SMTP
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SENDER_EMAIL
        sync: false

      # Divers
      - key: COMMERCIALS_SEED
        sync: false

      # Ollama (si un jour un endpoint externe)
      # - key: OLLAMA_HOST
      #   value: https://votre-endpoint-ollama.example.com
      # - key: OLLAMA_MODEL
      #   value: qwen2.5:3b-instruct

  # ─── Worker Celery ───────────────────────────────────────────────
  - type: worker
    name: UlySearch-worker
    runtime: docker
    plan: starter
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: celery -A app.core.celery_app worker --loglevel=INFO --concurrency=2
    envVars:
      - key: ENV
        value: production

      - key: UNIVERSAL_ENRICH_DETAIL
        value: "false"

      - key: DATABASE_URL
        fromDatabase:
          name: UlySearch-db
          property: connectionString

      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: UlySearch-redis
          property: connectionString

      - key: CACHE_REDIS_URL
        fromService:
          type: keyvalue
          name: UlySearch-cache
          property: connectionString

      - key: SOURCE_CREDENTIALS_KEY
        fromService:
          type: web
          name: UlySearch
          envVarKey: SOURCE_CREDENTIALS_KEY
      - key: JWT_SECRET_KEY
        fromService:
          type: web
          name: UlySearch
          envVarKey: JWT_SECRET_KEY

      - key: LLM_ENABLED
        value: "false"
      - key: TUNEPS_SSL_VERIFY
        value: "false"

      - key: SMTP_HOST
        fromService:
          type: web
          name: UlySearch
          envVarKey: SMTP_HOST
      - key: SMTP_PORT
        fromService:
          type: web
          name: UlySearch
          envVarKey: SMTP_PORT
      - key: SMTP_USER
        fromService:
          type: web
          name: UlySearch
          envVarKey: SMTP_USER
      - key: SMTP_PASSWORD
        fromService:
          type: web
          name: UlySearch
          envVarKey: SMTP_PASSWORD
      - key: SENDER_EMAIL
        fromService:
          type: web
          name: UlySearch
          envVarKey: SENDER_EMAIL
      - key: ADMIN_ALERT_EMAIL
        fromService:
          type: web
          name: UlySearch
          envVarKey: ADMIN_ALERT_EMAIL
      - key: DIRECTION_EMAIL
        fromService:
          type: web
          name: UlySearch
          envVarKey: DIRECTION_EMAIL
      - key: CORS_ORIGINS
        fromService:
          type: web
          name: UlySearch
          envVarKey: CORS_ORIGINS

  # ─── Scheduler Celery Beat ───────────────────────────────────────
  - type: worker
    name: UlySearch-scheduler
    runtime: docker
    plan: starter
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: celery -A app.core.celery_app beat --loglevel=INFO --schedule=/tmp/celerybeat-schedule
    envVars:
      - key: ENV
        value: production

      - key: UNIVERSAL_ENRICH_DETAIL
        value: "false"

      - key: DATABASE_URL
        fromDatabase:
          name: UlySearch-db
          property: connectionString

      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: UlySearch-redis
          property: connectionString

      - key: CACHE_REDIS_URL
        fromService:
          type: keyvalue
          name: UlySearch-cache
          property: connectionString

      - key: SOURCE_CREDENTIALS_KEY
        fromService:
          type: web
          name: UlySearch
          envVarKey: SOURCE_CREDENTIALS_KEY
      - key: JWT_SECRET_KEY
        fromService:
          type: web
          name: UlySearch
          envVarKey: JWT_SECRET_KEY

      - key: LLM_ENABLED
        value: "false"
      - key: TUNEPS_SSL_VERIFY
        value: "false"

      - key: SMTP_HOST
        fromService:
          type: web
          name: UlySearch
          envVarKey: SMTP_HOST
      - key: SMTP_PORT
        fromService:
          type: web
          name: UlySearch
          envVarKey: SMTP_PORT
      - key: SMTP_USER
        fromService:
          type: web
          name: UlySearch
          envVarKey: SMTP_USER
      - key: SMTP_PASSWORD
        fromService:
          type: web
          name: UlySearch
          envVarKey: SMTP_PASSWORD
      - key: SENDER_EMAIL
        fromService:
          type: web
          name: UlySearch
          envVarKey: SENDER_EMAIL
      - key: ADMIN_ALERT_EMAIL
        fromService:
          type: web
          name: UlySearch
          envVarKey: ADMIN_ALERT_EMAIL
      - key: DIRECTION_EMAIL
        fromService:
          type: web
          name: UlySearch
          envVarKey: DIRECTION_EMAIL