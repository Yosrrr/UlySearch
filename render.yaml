databases:
  - name: veilleao-db
    plan: basic-256mb
    region: frankfurt
    databaseName: veilleao
    user: veilleao

services:
  - type: keyvalue
    name: veilleao-redis
    plan: starter
    region: frankfurt
    ipAllowList: []
    maxmemoryPolicy: noeviction

  - type: web
    name: veilleao
    runtime: docker
    plan: starter
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    preDeployCommand: alembic upgrade head && python -m scripts.bootstrap
    envVars:
      - key: ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: veilleao-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: veilleao-redis
          property: connectionString
      - key: CACHE_REDIS_URL
        fromService:
          type: keyvalue
          name: veilleao-redis
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: INITIAL_ADMIN_EMAIL
        sync: false
      - key: INITIAL_ADMIN_PASSWORD
        sync: false
      - key: INITIAL_ADMIN_NAME
        value: Administrateur VeilleAO
      - key: ADMIN_ALERT_EMAIL
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SENDER_EMAIL
        sync: false
      - key: COMMERCIALS_SEED
        sync: false
      

  - type: worker
    name: veilleao-worker
    runtime: docker
    plan: starter
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: celery -A app.core.celery_app worker --loglevel=INFO
    envVars:
      - key: ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: veilleao-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: veilleao-redis
          property: connectionString
      - key: CACHE_REDIS_URL
        fromService:
          type: keyvalue
          name: veilleao-redis
          property: connectionString
      - key: JWT_SECRET_KEY
        fromService:
          type: web
          name: veilleao
          envVarKey: JWT_SECRET_KEY
      - key: SMTP_USER
        fromService:
          type: web
          name: veilleao
          envVarKey: SMTP_USER
      - key: SMTP_PASSWORD
        fromService:
          type: web
          name: veilleao
          envVarKey: SMTP_PASSWORD
      - key: SENDER_EMAIL
        fromService:
          type: web
          name: veilleao
          envVarKey: SENDER_EMAIL
      - key: ADMIN_ALERT_EMAIL
        fromService:
          type: web
          name: veilleao
          envVarKey: ADMIN_ALERT_EMAIL

  - type: worker
    name: veilleao-scheduler
    runtime: docker
    plan: starter
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: celery -A app.core.celery_app beat --loglevel=INFO --schedule=/tmp/celerybeat-schedule
    envVars:
      - key: ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: veilleao-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: veilleao-redis
          property: connectionString
      - key: CACHE_REDIS_URL
        fromService:
          type: keyvalue
          name: veilleao-redis
          property: connectionString
      - key: JWT_SECRET_KEY
        fromService:
          type: web
          name: veilleao
          envVarKey: JWT_SECRET_KEY
